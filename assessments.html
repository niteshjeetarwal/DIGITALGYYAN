<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIGITALGYYAN | Assessments</title><style>body{font-family:system-ui,Arial;background:#f4f7fb;color:#14243a;margin:0}.wrap{max-width:1000px;margin:auto;padding:22px}a{color:#174eaa}.card{background:white;border:1px solid #dfe7f0;border-radius:12px;padding:15px;margin:10px 0}h1{color:#10243a}</style></head><body><main class="wrap"><a href="index.html">← Home</a><h1>Assessment & Practice</h1><p>Choose an available interactive practice tool.</p><div id="items">Loading…</div></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));fetch("catalog.json").then(r=>r.json()).then(d=>{let a=(d.items||[]).filter(x=>x.section==="Assessment & Practice");document.getElementById("items").innerHTML=a.map(x=>`<article class="card"><h3>${esc(x.title)}</h3><p>${esc(x.subsection||"Assessment")}</p><a href="${encodeURI(x.path)}">Open tool ↗</a></article>`).join("")||"No assessments listed yet."}).catch(()=>document.getElementById("items").textContent="Could not load catalog.");</script></body></html>
