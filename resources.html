<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Resources | DIGITALGYYAN</title><style>
:root{--navy:#10243a;--blue:#1d5ed8;--bg:#f4f7fb;--ink:#14243a;--muted:#64758a;--line:#dfe7f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.hero{background:linear-gradient(135deg,#10243a,#1b456c);color:#fff;padding:24px 18px}.wrap{max-width:1100px;margin:auto}h1{margin:0 0 7px;font-size:clamp(25px,4vw,36px)}.hero p{margin:0;color:#d8e5f1}.back{display:inline-block;color:#fff;margin-top:15px}.main{max-width:1100px;margin:auto;padding:20px 16px 48px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}.filters input,.filters select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.notice{font-size:13px;color:var(--muted);margin:10px 0 18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.tag{font-size:11px;color:#174eaa;background:#edf4ff;padding:5px 8px;border-radius:999px;display:inline-block}.card h3{font-size:16px;overflow-wrap:anywhere;margin:12px 0 6px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions a{background:#1d5ed8;color:#fff;text-decoration:none;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:700}.actions a.alt{background:#e9eef5;color:#14243a}.empty{background:white;border:1px dashed #c7d4e2;padding:20px;border-radius:12px;color:#64758a}@media(max-width:700px){.filters,.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.filters,.grid{grid-template-columns:1fr}}
</style></head><body><header class="hero"><div class="wrap"><h1>DIGITALGYYAN Study Resources</h1><p>Browse published notes, model papers, images, documents and practice materials.</p><a class="back" href="index.html">← Back to Home</a></div></header><main class="main"><div class="filters"><input id="q" type="search" placeholder="Search title or topic…"><select id="section"><option value="">All sections</option></select><select id="category"><option value="">All categories</option></select></div><div id="status" class="notice">Loading published resources…</div><div id="grid" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-config.js"></script><script>
const cfg=window.DG_SUPABASE_CONFIG||{};const ready=cfg.url&&cfg.anonKey&&!cfg.url.includes('YOUR_')&&!cfg.anonKey.includes('YOUR_');let sb=null,all=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fillFilters(){const ss=[...new Set(all.map(x=>x.section).filter(Boolean))].sort();$('section').innerHTML='<option value="">All sections</option>'+ss.map(s=>`<option>${esc(s)}</option>`).join('');fillCats();}function fillCats(){let s=$('section').value;let cs=[...new Set(all.filter(x=>!s||x.section===s).map(x=>x.category).filter(Boolean))].sort();let old=$('category').value;$('category').innerHTML='<option value="">All categories</option>'+cs.map(c=>`<option>${esc(c)}</option>`).join('');if(cs.includes(old))$('category').value=old;}function render(){let q=$('q').value.trim().toLowerCase(),s=$('section').value,c=$('category').value;let arr=all.filter(x=>(!s||x.section===s)&&(!c||x.category===c)&&[x.title,x.description,x.section,x.category,x.subject].join(' ').toLowerCase().includes(q));$('status').textContent=`${arr.length} published resource${arr.length===1?'':'s'}`;$('grid').innerHTML=arr.map(x=>{let url=x.file_url||'#';let image=(x.file_type||'').startsWith('image/');return `<article class="card">${image?`<img src="${esc(url)}" alt="${esc(x.title)}" style="width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:#f4f7fb">`:''}<span class="tag">${esc(x.file_type==='application/pdf'?'PDF':image?'IMAGE':(x.file_type||'FILE').split('/').pop().toUpperCase())}</span><h3>${esc(x.title)}</h3><div class="meta">${esc([x.section,x.subject,x.category].filter(Boolean).join(' · '))}</div>${x.description?`<p>${esc(x.description)}</p>`:''}<div class="actions"><a href="${esc(url)}" target="_blank" rel="noopener">${image?'Open image':'Open / Download'}</a>${!image?`<a class="alt" href="${esc(url)}" download>Download</a>`:''}</div></article>`}).join('')||'<div class="empty">No published resources found yet. Please check back later.</div>';}$('section').addEventListener('change',()=>{fillCats();render()});$('category').addEventListener('change',render);$('q').addEventListener('input',render);if(!ready){$('status').textContent='Admin setup is not complete yet. The site owner must set SUPABASE_URL and SUPABASE_ANON_KEY in Netlify environment variables and redeploy.';$('grid').innerHTML='<div class="empty">Resources will appear here after the site owner completes the one-time setup.</div>';}else{sb=window.supabase.createClient(cfg.url,cfg.anonKey);sb.from('dg_resources').select('id,title,description,section,subject,category,file_url,file_type,created_at').eq('published',true).order('created_at',{ascending:false}).then(({data,error})=>{if(error){$('status').textContent='Could not load resources. The site owner should check the Supabase setup.';return}all=data||[];fillFilters();render()})}
</script></body></html>
